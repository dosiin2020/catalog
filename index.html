<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동네 길고양이 개체 식별 서비스</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet 지도 라이브러리 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 max-w-md mx-auto min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-amber-400 p-4 text-white font-bold text-lg flex justify-between items-center shadow-md">
        <span>🐾 우리동네 고양이 수호대</span>
        <span class="text-xs bg-white text-amber-600 px-2 py-1 rounded-full">MVP v0.5</span>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 p-4 pb-24 space-y-4">
        <!-- 안내 배너 -->
        <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800">
            <p class="font-semibold">🚨 필수 준수 사항</p>
            <p>· 고양이만 촬영해주세요. (사람 및 차량 번호판 절대 금지)</p>
            <p>· 위치는 고양이 보호를 위해 안전 반경으로 자동 분산 표시됩니다.</p>
        </div>

        <!-- GPS 기반 지도 영역 -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 p-2">
            <div class="text-xs font-bold text-gray-600 mb-1 px-1">📍 내 주변 길고양이 목격 지도</div>
            <div id="map" class="w-full h-48 rounded-lg z-0"></div>
        </div>

        <!-- 타임라인 피드 리스트 -->
        <div class="font-bold text-sm text-gray-700 mt-2">✨ 실시간 동네 제보 피드</div>
        <div id="feed-list" class="space-y-4">
            <div class="bg-white rounded-xl shadow-sm p-4 text-center text-gray-400 text-xs">
                데이터를 불러오는 중...
            </div>
        </div>
    </main>

    <!-- 하단 고정 제보 버튼 (사진 먼저 촬영/선택) -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white border-t border-gray-200 p-3 flex justify-center shadow-lg z-50">
        <label class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center gap-2 cursor-pointer text-center">
            <span>📷 고양이 사진 먼저 찍기 / 선택하기</span>
            <input type="file" id="initial-cat-image" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
        </label>
    </nav>

    <!-- 사진 선택 후 나타나는 개체 확인 및 등록 모달 -->
    <div id="report-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg text-gray-800">🐾 고양이 개체 확인</h3>
            <p class="text-xs text-gray-500">찍으신 사진과 아래 동네 친구들을 비교해보세요!</p>

            <!-- 찍은 사진 미리보기 -->
            <div class="w-full h-40 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center border border-gray-200">
                <img id="preview-img" class="w-full h-full object-cover">
            </div>

            <!-- 기존 고양이 선택 영역 (중복 체크) -->
            <div>
                <label class="text-xs text-gray-500 font-semibold">1. 이미 등록된 동네 고양이인가요?</label>
                <div id="existing-cats-container" class="mt-2 space-y-2 max-h-36 overflow-y-auto border border-gray-200 rounded-xl p-2 bg-gray-50">
                    <p class="text-xs text-center text-gray-400 py-2">등록된 고양이 불러오는 중...</p>
                </div>
            </div>

            <div class="border-t border-gray-200 pt-3">
                <label class="text-xs text-gray-500 font-semibold">2. 새로운 고양이라면 이름을 입력해주세요</label>
                <input type="text" id="new-cat-name" placeholder="예: 치즈, 삼색이, 뚱냥이" class="w-full mt-1 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeReportModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-bold">취소</button>
                <button onclick="submitReport()" id="submit-btn" class="flex-1 bg-amber-500 text-white py-2 rounded-xl text-sm font-bold">등록하기</button>
            </div>
        </div>
    </div>

    <!-- 로직 스크립트 -->
    <script>
        const SUPABASE_URL = 'https://zholdszcpnnotiofoeot.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SL6t58EupHer5LU-O9L7Qw_xGg5Iz5-';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let map, userMarker;
        let currentLat = 37.5665; 
        let currentLng = 126.9780;
        let selectedCompressedBlob = null;
        let selectedExistingCatId = null; // 기존 고양이를 선택했을 때의 ID

        function initMap() {
            map = L.map('map').setView([currentLat, currentLng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    map.setView([currentLat, currentLng], 15);

                    userMarker = L.circleMarker([currentLat, currentLng], {
                        radius: 8, color: '#ffffff', weight: 2, fillColor: '#3b82f6', fillOpacity: 1
                    }).addTo(map).bindPopup("내 현재 위치").openPopup();
                });
            }
        }

        async function fetchCats() {
            const feedList = document.getElementById('feed-list');
            const { data, error } = await supabaseClient.from('cats').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                feedList.innerHTML = `<div class="bg-white rounded-xl shadow-sm p-6 text-center text-gray-400 text-sm">아직 등록된 고양이가 없어요. 첫 제보를 남겨주세요! 🐾</div>`;
                return;
            }

            feedList.innerHTML = data.map(cat => `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="p-3 flex items-center justify-between">
                        <span class="font-bold text-sm">🧀 ${cat.name || '이름 없음'}</span>
                        <span class="text-xs text-gray-400">등록됨</span>
                    </div>
                    <div class="bg-gray-100 h-48 flex items-center justify-center text-gray-400 text-xs overflow-hidden">
                        ${cat.image_url ? `<img src="${cat.image_url}" class="w-full h-full object-cover">` : '[사진 없음]'}
                    </div>
                    <div class="p-3 text-xs text-gray-600">
                        <p>📍 위치 정보 보호 적용됨</p>
                    </div>
                </div>
            `).join('');
        }

        // 이미지 압축 함수
        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_WIDTH = 800;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.8);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 1. 하단 버튼에서 사진을 고르거나 찍었을 때 실행되는 함수
        async function handleImageSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 압축 및 미리보기 설정
            selectedCompressedBlob = await resizeImage(file);
            document.getElementById('preview-img').src = URL.createObjectURL(selectedCompressedBlob);
            
            // 모달 열기 및 기존 고양이 목록 불러오기 (중복 체크용)
            document.getElementById('report-modal').classList.remove('hidden');
            loadExistingCatsForMatch();
            
            // 파일 input 초기화 (같은 사진 다시 선택 가능하게)
            event.target.value = '';
        }

        // 2. 모달 내에 기존 등록된 고양이 목록 렌더링 (클해서 선택 가능)
        async function loadExistingCatsForMatch() {
            const container = document.getElementById('existing-cats-container');
            const { data, error } = await supabaseClient.from('cats').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-center text-gray-400 py-2">등록된 기존 고양이가 없습니다. 아래에 새 이름을 적어주세요!</p>`;
                return;
            }

            selectedExistingCatId = null; // 초기화
            container.innerHTML = `
                <div onclick="selectExistingCat(null, this)" class="existing-cat-card p-2 rounded-lg border border-amber-500 bg-amber-50 text-xs font-bold cursor-pointer text-center">
                    ✨ 새로운 고양이로 등록할래요!
                </div>
            ` + data.map(cat => `
                <div onclick="selectExistingCat('${cat.id}', this)" class="existing-cat-card p-2 rounded-lg border border-gray-200 bg-white text-xs flex items-center gap-3 cursor-pointer hover:border-amber-400">
                    <img src="${cat.image_url || ''}" class="w-10 h-10 rounded-full object-cover bg-gray-200">
                    <div>
                        <p class="font-bold">🧀 ${cat.name}</p>
                        <p class="text-[10px] text-gray-400">기존 등록된 친구</p>
                    </div>
                </div>
            `).join('');
        }

        // 기존 고양이 선택 시 카드 강조 효과
        window.selectExistingCat = function(catId, element) {
            selectedExistingCatId = catId;
            document.querySelectorAll('.existing-cat-card').forEach(card => {
                card.classList.remove('border-amber-500', 'bg-amber-50');
                card.classList.add('border-gray-200', 'bg-white');
            });
            element.classList.remove('border-gray-200', 'bg-white');
            element.classList.add('border-amber-500', 'bg-amber-50');

            const nameInput = document.getElementById('new-cat-name');
            if (catId) {
                nameInput.value = '';
                nameInput.disabled = true;
                nameInput.placeholder = "기존 고양이에 목격 기록이 추가됩니다.";
            } else {
                nameInput.disabled = false;
                nameInput.placeholder = "예: 치즈, 삼색이, 뚱냥이";
            }
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
            selectedCompressedBlob = null;
            selectedExistingCatId = null;
        }

        // 3. 최종 등록 실행 (새 고양이 생성 or 기존 고양이 목격 추가)
        async function submitReport() {
            const nameInput = document.getElementById('new-cat-name');
            const submitBtn = document.getElementById('submit-btn');
            const newName = nameInput.value.trim();

            if (!selectedExistingCatId && !newName) {
                alert('새로운 고양이 이름을 입력하거나, 위 목록에서 기존 고양이를 선택해주세요!');
                return;
            }

            submitBtn.innerText = '저장 중...';
            submitBtn.disabled = true;

            try {
                // 1. 이미지 Storage 업로드
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.jpg`;
                const { error: uploadError } = await supabaseClient.storage.from('cat-images').upload(fileName, selectedCompressedBlob, {
                    contentType: 'image/jpeg'
                });

                if (uploadError) throw new Error('사진 업로드 실패: ' + uploadError.message);

                const { data: publicData } = supabaseClient.storage.from('cat-images').getPublicUrl(fileName);
                const imageUrl = publicData.publicUrl;

                // 2. 위치 분산 (보안용 랜덤 오프셋)
                const finalLat = currentLat + (Math.random() - 0.5) * 0.002;
                const finalLng = currentLng + (Math.random() - 0.5) * 0.002;

                if (selectedExistingCatId) {
                    // 기존 고양이가 선택된 경우: cats 테이블에 사진/위치 업데이트 혹은 별도 목격 테이블에 추가
                    // 여기서는 심플하게 해당 고양이의 최신 프로필 사진과 위치를 갱신
                    const { error: updateError } = await supabaseClient.from('cats').update({
                        image_url: imageUrl,
                        latitude: finalLat,
                        longitude: finalLng
                    }).eq('id', selectedExistingCatId);

                    if (updateError) throw new Error('기존 고양이 업데이트 실패');
                    alert('기존 고양이 목격 기록이 성공적으로 추가되었습니다! 🐾');

                } else {
                    // 새로운 고양이인 경우: 새로 생성
                    const { error: insertError } = await supabaseClient.from('cats').insert([{
                        name: newName,
                        image_url: imageUrl,
                        latitude: finalLat,
                        longitude: finalLng
                    }]);

                    if (insertError) throw new Error('새 고양이 등록 실패');
                    alert('새로운 고양이가 성공적으로 등록되었습니다! 🐾');
                }

                closeReportModal();
                nameInput.value = '';
                fetchCats();

            } catch (err) {
                alert(err.message);
            } finally {
                submitBtn.innerText = '등록하기';
                submitBtn.disabled = false;
            }
        }

        initMap();
        fetchCats();
    </script>
</body>
</html>
