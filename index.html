<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 멍냥이 수호대 - 우리동네 친구들을 등록해줘!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet 지도 라이브러리 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 max-w-md mx-auto min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-indigo-600 p-4 text-white font-bold text-lg flex justify-between items-center shadow-md">
        <span>🐶🐱 우리동네 멍냥이 수호대</span>
        <span class="text-xs bg-white text-indigo-600 px-2 py-1 rounded-full">MVP v1.0</span>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 p-4 pb-24 space-y-4">
        <!-- 안내 배너 -->
        <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3 text-xs text-indigo-900">
            <p class="font-semibold">🚨 우리동네 반려동물 지킴이 안내</p>
            <p>· 길냥이 혹은 길 잃은 강아지를 발견하셨나요?</p>
            <p>· 인식표가 있다면 정확한 이름을, 없다면 특징을 남겨주세요!</p>
        </div>

        <!-- GPS 기반 지도 영역 -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 p-2">
            <div class="text-xs font-bold text-gray-600 mb-1 px-1">📍 내 주변 멍냥이 목격 지도</div>
            <div id="map" class="w-full h-48 rounded-lg z-0"></div>
        </div>

        <!-- 탭 필터 (전체 / 강아지 / 고양이) -->
        <div class="flex gap-2">
            <button onclick="filterPets('all')" id="filter-all" class="flex-1 bg-indigo-600 text-white text-xs font-bold py-2 rounded-xl transition">전체보기</button>
            <button onclick="filterPets('dog')" id="filter-dog" class="flex-1 bg-white border border-gray-200 text-gray-600 text-xs font-bold py-2 rounded-xl transition">🐶 강아지</button>
            <button onclick="filterPets('cat')" id="filter-cat" class="flex-1 bg-white border border-gray-200 text-gray-600 text-xs font-bold py-2 rounded-xl transition">🐱 고양이</button>
        </div>

        <!-- 타임라인 피드 리스트 -->
        <div class="font-bold text-sm text-gray-700 mt-2">✨ 실시간 동네 제보 피드</div>
        <div id="feed-list" class="space-y-4">
            <div class="bg-white rounded-xl shadow-sm p-4 text-center text-gray-400 text-xs">
                데이터를 불러오는 중...
            </div>
        </div>
    </main>

    <!-- 하단 고정 제보 버튼 (사진 먼저 촬영/선택) -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white border-t border-gray-200 p-3 flex justify-center shadow-lg z-50">
        <label class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center gap-2 cursor-pointer text-center text-sm">
            <span>📷 멍냥이 사진 찍기</span>
            <input type="file" id="initial-pet-image" accept="image/*" class="hidden" onchange="handleImageSelected(event)">
        </label>
    </nav>

    <!-- 사진 선택 후 나타나는 개체 확인 및 등록 모달 -->
    <div id="report-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg text-gray-800">🐾 멍냥이 개체 확인</h3>
            <p class="text-xs text-gray-500">찍으신 사진과 아래 동네 친구들을 비교해보세요!</p>

            <!-- 찍은 사진 미리보기 -->
            <div class="w-full h-40 bg-gray-100 rounded-xl overflow-hidden flex items-center justify-center border border-gray-200 relative">
                <img id="preview-img" class="w-full h-full object-cover">
            </div>

            <!-- 동물 종류 선택 (강아지 vs 고양이) -->
            <div>
                <label class="text-xs text-gray-500 font-semibold">어떤 동물인가요?</label>
                <div class="grid grid-cols-2 gap-2 mt-1">
                    <button type="button" onclick="setPetType('dog')" id="type-dog-btn" class="border border-indigo-600 bg-indigo-50 text-indigo-700 font-bold py-2 rounded-xl text-xs transition">🐶 강아지</button>
                    <button type="button" onclick="setPetType('cat')" id="type-cat-btn" class="border border-gray-200 bg-white text-gray-600 font-bold py-2 rounded-xl text-xs transition">🐱 고양이</button>
                </div>
            </div>

            <!-- 기존 동물 선택 영역 (중복 체크) -->
            <div>
                <label class="text-xs text-gray-500 font-semibold">1. 이미 등록된 동네 친구인가요?</label>
                <div id="existing-pets-container" class="mt-2 space-y-2 max-h-32 overflow-y-auto border border-gray-200 rounded-xl p-2 bg-gray-50">
                    <p class="text-xs text-center text-gray-400 py-2">등록된 친구들 불러오는 중...</p>
                </div>
            </div>

            <div class="border-t border-gray-200 pt-3">
                <label class="text-xs text-gray-500 font-semibold">2. 새로운 친구라면 이름(인식표 이름)을 적어주세요</label>
                <input type="text" id="new-pet-name" placeholder="예: 초코, 몽이, 혹은 '인식표 없음(노랑이)'" class="w-full mt-1 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeReportModal()" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-bold">취소</button>
                <button onclick="submitReport()" id="submit-btn" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-bold">등록하기</button>
            </div>
        </div>
    </div>

    <!-- 로직 스크립트 -->
    <script>
        const SUPABASE_URL = 'https://zholdszcpnnotiofoeot.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_SL6t58EupHer5LU-O9L7Qw_xGg5Iz5-';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let map, userMarker;
        let currentLat = 37.5665; 
        let currentLng = 126.9780;
        let selectedCompressedBlob = null;
        let selectedExistingPetId = null; 
        let selectedPetType = 'dog'; // 기본값 강아지
        let currentFilter = 'all';
        let allPetsData = [];

        function initMap() {
            map = L.map('map').setView([currentLat, currentLng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    map.setView([currentLat, currentLng], 15);

                    userMarker = L.circleMarker([currentLat, currentLng], {
                        radius: 8, color: '#ffffff', weight: 2, fillColor: '#4f46e5', fillOpacity: 1
                    }).addTo(map).bindPopup("내 현재 위치").openPopup();
                });
            }
        }

        async function fetchPets() {
            const feedList = document.getElementById('feed-list');
            const { data, error } = await supabaseClient.from('cats').select('*').order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                feedList.innerHTML = `<div class="bg-white rounded-xl shadow-sm p-6 text-center text-gray-400 text-sm">아직 등록된 멍냥이가 없어요. 첫 제보를 남겨주세요! 🐾</div>`;
                return;
            }

            allPetsData = data;
            renderFeed();
        }

        function renderFeed() {
            const feedList = document.getElementById('feed-list');
            let filtered = allPetsData;

            if (currentFilter !== 'all') {
                filtered = allPetsData.filter(p => p.type === currentFilter);
            }

            if (filtered.length === 0) {
                feedList.innerHTML = `<div class="bg-white rounded-xl shadow-sm p-6 text-center text-gray-400 text-sm">해당하는 동물이 없어요!</div>`;
                return;
            }

            feedList.innerHTML = filtered.map(pet => {
                const badgeText = pet.type === 'dog' ? '🐶 강아지' : '🐱 고양이';
                const badgeColor = pet.type === 'dog' ? 'bg-amber-100 text-amber-800' : 'bg-purple-100 text-purple-800';
                
                return `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                        <div class="p-3 flex items-center justify-between">
                            <span class="font-bold text-sm">${pet.name || '이름 없음'}</span>
                            <span class="text-[10px] ${badgeColor} px-2 py-0.5 rounded-full font-bold">${badgeText}</span>
                        </div>
                        <div class="bg-gray-100 h-48 flex items-center justify-center text-gray-400 text-xs overflow-hidden">
                            ${pet.image_url ? `<img src="${pet.image_url}" class="w-full h-full object-cover">` : '[사진 없음]'}
                        </div>
                        <div class="p-3 text-xs text-gray-600 flex justify-between items-center">
                            <p>📍 위치 정보 보호 적용됨</p>
                            <span class="text-[10px] text-gray-400">${new Date(pet.created_at).toLocaleDateString()} 제보됨</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterPets(type) {
            currentFilter = type;
            ['all', 'dog', 'cat'].forEach(t => {
                const btn = document.getElementById(`filter-${t}`);
                if (t === type) {
                    btn.className = "flex-1 bg-indigo-600 text-white text-xs font-bold py-2 rounded-xl transition";
                } else {
                    btn.className = "flex-1 bg-white border border-gray-200 text-gray-600 text-xs font-bold py-2 rounded-xl transition";
                }
            });
            renderFeed();
        }

        function setPetType(type) {
            selectedPetType = type;
            const dogBtn = document.getElementById('type-dog-btn');
            const catBtn = document.getElementById('type-cat-btn');

            if (type === 'dog') {
                dogBtn.className = "border border-indigo-600 bg-indigo-50 text-indigo-700 font-bold py-2 rounded-xl text-xs transition";
                catBtn.className = "border border-gray-200 bg-white text-gray-600 font-bold py-2 rounded-xl text-xs transition";
            } else {
                catBtn.className = "border border-indigo-600 bg-indigo-50 text-indigo-700 font-bold py-2 rounded-xl text-xs transition";
                dogBtn.className = "border border-gray-200 bg-white text-gray-600 font-bold py-2 rounded-xl text-xs transition";
            }
            loadExistingPetsForMatch();
        }

        // 이미지 압축 함수
        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_WIDTH = 800;

                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', 0.8);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleImageSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedCompressedBlob = await resizeImage(file);
            document.getElementById('preview-img').src = URL.createObjectURL(selectedCompressedBlob);
            
            document.getElementById('report-modal').classList.remove('hidden');
            loadExistingPetsForMatch();
            
            event.target.value = '';
        }

        async function loadExistingPetsForMatch() {
            const container = document.getElementById('existing-pets-container');
            // 선택된 타입(강아지 또는 고양이)에 맞는 친구들만 필터링해서 비교
            const { data, error } = await supabaseClient.from('cats').select('*').eq('type', selectedPetType).order('created_at', { ascending: false });

            if (error || !data || data.length === 0) {
                container.innerHTML = `<p class="text-xs text-center text-gray-400 py-2">등록된 기존 친구가 없습니다. 아래에 새 이름을 적어주세요!</p>`;
                return;
            }

            selectedExistingPetId = null; 
            container.innerHTML = `
                <div onclick="selectExistingPet(null, this)" class="existing-pet-card p-2 rounded-lg border border-indigo-500 bg-indigo-50 text-xs font-bold cursor-pointer text-center">
                    ✨ 새로운 친구로 등록할래요!
                </div>
            ` + data.map(pet => `
                <div onclick="selectExistingPet('${pet.id}', this)" class="existing-pet-card p-2 rounded-lg border border-gray-200 bg-white text-xs flex items-center gap-3 cursor-pointer hover:border-indigo-400">
                    <img src="${pet.image_url || ''}" class="w-10 h-10 rounded-full object-cover bg-gray-200">
                    <div>
                        <p class="font-bold">${pet.name}</p>
                        <p class="text-[10px] text-gray-400">기존 등록된 친구</p>
                    </div>
                </div>
            `).join('');
        }

        window.selectExistingPet = function(petId, element) {
            selectedExistingPetId = petId;
            document.querySelectorAll('.existing-pet-card').forEach(card => {
                card.classList.remove('border-indigo-500', 'bg-indigo-50');
                card.classList.add('border-gray-200', 'bg-white');
            });
            element.classList.remove('border-gray-200', 'bg-white');
            element.classList.add('border-indigo-500', 'bg-indigo-50');

            const nameInput = document.getElementById('new-pet-name');
            if (petId) {
                nameInput.value = '';
                nameInput.disabled = true;
                nameInput.placeholder = "기존 친구에 목격 기록이 추가됩니다.";
            } else {
                nameInput.disabled = false;
                nameInput.placeholder = "예: 초코, 인식표 없음(털색 등)";
            }
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
            selectedCompressedBlob = null;
            selectedExistingPetId = null;
        }

        async function submitReport
